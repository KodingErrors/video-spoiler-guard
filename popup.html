<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video Spoiler Guard</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Video Spoiler Guard</h1>
  </header>
  <main>
    <section id="here" aria-labelledby="here-host" hidden>
      <div class="here-head">
        <span class="host" id="here-host"></span>
        <span class="pill" id="here-pill"></span>
      </div>
      <label class="switch-row" for="here-toggle">
        <span>
          <strong>Hide video lengths on this site</strong>
          <small id="here-hint"></small>
        </span>
        <input type="checkbox" class="switch" id="here-toggle">
      </label>
      <label class="check-row" for="here-ask" id="here-ask-row">
        <input type="checkbox" id="here-ask">
        Show the dialog when a video starts
      </label>
      <div class="session-note" id="here-session" hidden>
        <span id="here-session-text"></span>
        <button class="link" type="button" id="here-session-clear">Forget</button>
      </div>
      <p class="error" id="here-error" role="alert"></p>
    </section>
    <section id="here-unsupported" hidden>
      <p class="hint">This page can't be guarded. Open a page with a video to change its setting.</p>
    </section>
  </main>
  <footer>
    <small id="range"></small>
    <button class="btn" type="button" id="open-dashboard">Open dashboard</button>
  </footer>
  <script src="lib.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
